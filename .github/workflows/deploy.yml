name: Deploy ETL Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy-notebooks:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          pip install databricks-cli

      - name: Deploy notebooks to Databricks
        run: |
          databricks workspace mkdirs /Shared/etl-pipeline
          for notebook in notebooks/*.py; do
            name=$(basename $notebook .py)
            echo "Deploying $name"
            databricks workspace import \
              --language PYTHON \
              --format SOURCE \
              --overwrite \
              $notebook \
              /Shared/etl-pipeline/$name
          done

  deploy-synapse:
    runs-on: ubuntu-latest
    needs: deploy-notebooks
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Synapse SQL scripts
        run: |
          for f in synapse/*.sql; do
            echo "Running $f"
            az synapse sql script run \
              --workspace-name synw-etl-pipeline \
              --name $(basename $f .sql) \
              --file @$f
          done
