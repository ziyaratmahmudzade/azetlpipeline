name: Deploy ETL Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy-notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Databricks CLI
        run: pip install databricks-cli

      - name: Configure Databricks CLI
        run: |
          databricks configure --token <<EOF
          ${{ secrets.DATABRICKS_HOST }}
          ${{ secrets.DATABRICKS_TOKEN }}
          EOF

      - name: Deploy notebooks to Databricks
        run: |
          databricks workspace import_dir notebooks/ /Shared/etl-pipeline \
            --overwrite

  deploy-synapse:
    runs-on: ubuntu-latest
    needs: deploy-notebooks
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Synapse SQL scripts
        run: |
          for f in synapse/*.sql; do
            echo "Running $f"
            az synapse sql script run \
              --workspace-name synw-etl-pipeline \
              --name $(basename $f .sql) \
              --file @$f
          done
