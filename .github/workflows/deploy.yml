name: Deploy ETL Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy-notebooks:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: pip install databricks-cli

      - name: Deploy notebooks to Databricks
        run: |
          databricks workspace mkdirs /Shared/etl-pipeline
          for notebook in notebooks/*.py; do
            name=$(basename $notebook .py)
            echo "Deploying $name"
            databricks workspace import \
              --language PYTHON \
              --format SOURCE \
              --overwrite \
              $notebook \
              /Shared/etl-pipeline/$name
          done
          echo "All notebooks deployed successfully"
