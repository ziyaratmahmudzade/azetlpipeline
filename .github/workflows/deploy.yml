name: Deploy ETL Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy-notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Configure Databricks CLI
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks configure --host $DATABRICKS_HOST --token $DATABRICKS_TOKEN

          - name: Deploy notebooks to Databricks
                  env:
                    DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
                    DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
                  run: |
                    for notebook in notebooks/*.py; do
                      name=$(basename $notebook .py)
                      echo "Deploying $notebook as $name"
                      databricks workspace import \
                        --file $notebook \
                        --format SOURCE \
                        --language PYTHON \
                        --overwrite \
                        /Shared/etl-pipeline/$name
                    done

  deploy-synapse:
    runs-on: ubuntu-latest
    needs: deploy-notebooks
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Synapse SQL scripts
        run: |
          for f in synapse/*.sql; do
            echo "Running $f"
            az synapse sql script run \
              --workspace-name synw-etl-pipeline \
              --name $(basename $f .sql) \
              --file @$f
          done
